# Deploys the app to a Hugging Face Space on every push to main.
# One-time setup: add a Hugging Face access token (write) as the repo secret HF_TOKEN.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet huggingface_hub
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add a Hugging Face write token as the HF_TOKEN repo secret"; exit 1; fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = f"{api.whoami()['name']}/ert-roleplay-room"
          api.create_repo(repo_id, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              folder_path=".", repo_id=repo_id, repo_type="space",
              ignore_patterns=[".git/*", ".github/*", "node_modules/*", "dist/*", "data/*", ".claude/*"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
          )
          owner, name = repo_id.split("/")
          print(f"Deployed. App URL: https://{owner.lower()}-{name}.hf.space")
          PY
